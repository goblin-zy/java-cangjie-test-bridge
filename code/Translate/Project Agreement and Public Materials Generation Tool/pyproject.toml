[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-materials-tool"
version = "0.1.0"
description = "Evidence-backed Java/Cangjie project materials for a Codex workflow"
requires-python = ">=3.11"
dependencies = ["pydantic==2.10.3", "pydantic-core==2.27.1", "annotated-types==0.6.0", "typing_extensions==4.12.2"]

[project.scripts]
pmtool = "pmtool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

